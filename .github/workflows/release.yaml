name: Create release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-build:
    name: Build release binaries for ${{ matrix.target.GOOS }}-${{ matrix.target.type }}-${{ matrix.target.GOARCH }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.target.container }}
      env:
        DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        target:
          - GOOS: linux
            GOARCH: amd64
            container: ubuntu:24.04
            type: cpu

          - GOOS: linux
            GOARCH: arm64
            container: ubuntu:24.04
            type: cpu

          - GOOS: linux
            GOARCH: amd64
            container: livepeerci/cuda:12.8.1-cudnn-devel-ubuntu24.04
            type: gpu

          - GOOS: linux
            GOARCH: arm64
            container: livepeerci/cuda:12.8.1-cudnn-devel-ubuntu24.04
            type: gpu

          - GOOS: windows
            GOARCH: amd64
            container: ubuntu:24.04
            type: cpu

    steps:
      - name: Setup ubuntu container
        run: |
          apt update
          apt install -yqq build-essential make software-properties-common curl
          add-apt-repository -y ppa:git-core/candidate
          apt update && apt install -yqq git zip unzip zlib1g-dev zlib1g libzlcore-dev yasm libva-dev

      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up go
        id: go
        uses: actions/setup-go@v6
        with:
          go-version-file: './go.mod'
          cache: true
          cache-dependency-path: go.sum

      - name: Set build environment
        run: |
          echo "GOARCH=${{ matrix.target.GOARCH }}" >> $GITHUB_ENV
          echo "GOOS=${{ matrix.target.GOOS }}" >> $GITHUB_ENV
          echo "GO_BUILD_DIR=lp-builds/" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$HOME/compiled/lib/pkgconfig" >> $GITHUB_ENV
          echo "LP_BUILD_DIR=livepeer-${{ matrix.target.GOOS }}-${{ matrix.target.GOARCH }}" >> $GITHUB_ENV
          echo "GOBIN=$RUNNER_TEMP/go-bin" >> $GITHUB_ENV
          echo "$RUNNER_TEMP/go-bin" >> $GITHUB_PATH
          mkdir -p "$RUNNER_TEMP/go-bin" lp-builds/ releases/

      - name: Set GPU build environment
        if: matrix.target.type == 'gpu'
        run: |
          echo "CPATH=/usr/local/cuda_${{ matrix.target.GOARCH }}/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/usr/local/cuda_${{ matrix.target.GOARCH }}/lib64" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L/usr/local/cuda_${{ matrix.target.GOARCH }}/lib64" >> $GITHUB_ENV
          echo "RELEASE_TAG=gpu" >> $GITHUB_ENV
          echo "LP_BUILD_DIR=livepeer-${{ matrix.target.GOOS }}-gpu-${{ matrix.target.GOARCH }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          apt update
          apt -yqq install \
            nasm clang-14 clang-tools-14 lld-14 build-essential pkg-config autoconf git python3 \
            cmake ninja-build meson \
            gcc-mingw-w64 g++-mingw-w64-x86-64 libgcc-14-dev-arm64-cross libstdc++-14-dev-arm64-cross \
            mingw-w64-tools gcc-mingw-w64-x86-64 mingw-w64-x86-64-dev \
            golang-goprotobuf-dev protobuf-compiler-grpc

          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-14 30 \
            && update-alternatives --install /usr/bin/clang clang /usr/bin/clang-14 30 \
            && update-alternatives --install /usr/bin/ld ld /usr/bin/lld-14 30

      - name: Install go modules
        if: steps.go.outputs.cache-hit != 'true'
        run: go mod download

      - name: Install protoc plugins
        run: |
          GOARCH= GOOS= go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.28.1
          GOARCH= GOOS= go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.2.0

      - name: Install zlib for windows
        if: matrix.target.GOOS == 'windows'
        env:
          CC: x86_64-w64-mingw32-gcc
        run: |
          apt install -yqq wget
          wget https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar -xzf zlib-1.3.1.tar.gz
          cd zlib-1.3.1
          ./configure --prefix=/usr/x86_64-w64-mingw32 --static
          make
          make install

      - name: Install ffmpeg
        run: ./install_ffmpeg.sh

      - name: Build binaries
        env:
          GHA_REF: ${{ github.ref }}
        run: |
          git config --global --add safe.directory '*'
          ./ci_env.sh make

      - name: Archive binaries for windows
        if: matrix.target.GOOS == 'windows'
        run: |
          mkdir -p "${GO_BUILD_DIR}/${LP_BUILD_DIR}/"
          cd "$GO_BUILD_DIR/"
          find . -type f -exec mv '{}' "$LP_BUILD_DIR/" \;
          zip -9rq "../releases/$LP_BUILD_DIR.zip" ./

      - name: Archive binaries
        if: matrix.target.GOOS != 'windows'
        run: |
          mkdir -p "${GO_BUILD_DIR}/${LP_BUILD_DIR}/"
          cd "$GO_BUILD_DIR/"
          find . -type f -exec mv '{}' "$LP_BUILD_DIR" \;
          tar -czvf "../releases/$LP_BUILD_DIR.tar.gz" ./

      - name: Upload release binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ matrix.target.GOOS }}-${{ matrix.target.type }}-${{ matrix.target.GOARCH }}
          path: releases/

  macos-build:
    name: Build release binaries for darwin-arm64
    runs-on: macos-arm64-self-hosted
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set build environment
        run: |
          echo "GOARCH=arm64" >> $GITHUB_ENV
          echo "GOOS=darwin" >> $GITHUB_ENV
          echo "GO_BUILD_DIR=lp-builds/" >> $GITHUB_ENV
          echo "LP_BUILD_DIR=livepeer-darwin-arm64" >> $GITHUB_ENV
          echo "GOBIN=$RUNNER_TEMP/go-bin" >> $GITHUB_ENV
          echo "$RUNNER_TEMP/go-bin" >> $GITHUB_PATH
          mkdir -p "$RUNNER_TEMP/go-bin" lp-builds/ releases/

      - name: Cache ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/compiled
          key: ${{ runner.os }}-darwin-arm64-ffmpeg-${{ hashFiles('**/install_ffmpeg.sh') }}

      - name: Install dependencies
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          brew install coreutils pkgconf nasm cmake meson ninja || true
          brew_prefix="$(brew --prefix)"
          echo "${brew_prefix}/bin" >> "$GITHUB_PATH"
          echo "${brew_prefix}/sbin" >> "$GITHUB_PATH"

      # Homebrew also ships a go binary. Run setup-go after Homebrew so the
      # go.mod-selected toolchain remains first on PATH in subsequent steps.
      - name: Set up go
        id: go
        uses: actions/setup-go@v6
        with:
          go-version-file: './go.mod'
          cache: true
          cache-dependency-path: go.sum

      - name: Install go modules
        run: go mod download

      - name: Install protoc plugins
        run: |
          GOARCH= GOOS= go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.28.1
          GOARCH= GOOS= go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.2.0

      - name: Install ffmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/compiled ~/ffmpeg ~/x264 ~/nv-codec-headers
          ./install_ffmpeg.sh

      - name: Build binaries
        env:
          GHA_REF: ${{ github.ref }}
        run: |
          git config --global --add safe.directory '*'
          export PKG_CONFIG_PATH=~/compiled/lib/pkgconfig
          ./ci_env.sh make

      - name: Archive binaries
        run: |
          mkdir -p "${GO_BUILD_DIR}/${LP_BUILD_DIR}/"
          cd "$GO_BUILD_DIR/"
          find . -type f -exec mv '{}' "$LP_BUILD_DIR" \;
          tar -czvf "../releases/${LP_BUILD_DIR}.tar.gz" .

      - name: Upload release binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-darwin-arm64
          path: releases/

  docker-amd64:
    name: Build release Docker image (amd64)
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Get build tags
        id: build-tag
        run: ./ci_env.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            livepeerframeworks/go-livepeer
            ghcr.io/livepeer-frameworks/go-livepeer
          tags: |
            type=sha
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            suffix=-amd64

      - name: Build and push (amd64)
        uses: docker/build-push-action@v7
        with:
          build-args: |
            BUILD_TAGS=${{ steps.build-tag.outputs.build-tags }}
          context: .
          platforms: linux/amd64
          push: true
          file: "docker/Dockerfile"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,scope=docker-amd64,mode=max,ignore-error=true

  docker-arm64:
    name: Build release Docker image (arm64)
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Get build tags
        id: build-tag
        run: ./ci_env.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            livepeerframeworks/go-livepeer
            ghcr.io/livepeer-frameworks/go-livepeer
          tags: |
            type=sha
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            suffix=-arm64

      - name: Build and push (arm64)
        uses: docker/build-push-action@v7
        with:
          build-args: |
            BUILD_TAGS=${{ steps.build-tag.outputs.build-tags }}
          context: .
          platforms: linux/arm64
          push: true
          file: "docker/Dockerfile"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-arm64
          cache-to: type=gha,scope=docker-arm64,mode=max,ignore-error=true

  docker-manifest:
    name: Publish release Docker manifest
    needs: [docker-amd64, docker-arm64]
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            livepeerframeworks/go-livepeer
            ghcr.io/livepeer-frameworks/go-livepeer
          tags: |
            type=sha
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create and push multi-arch manifests
        run: |
          set -euo pipefail
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Creating manifest for $tag"
            docker buildx imagetools create -t "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done

      - name: Save Docker release metadata
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          tag="${GITHUB_REF_NAME}"
          image="ghcr.io/livepeer-frameworks/go-livepeer:${tag}"
          digest="sha256:$(docker buildx imagetools inspect "${image}" --raw | sha256sum | cut -d' ' -f1)"
          echo "${tag}" > release-metadata/docker-tag.txt
          echo "${digest}" > release-metadata/docker-digest.txt
          echo "Tag: ${tag}"
          echo "Digest: ${digest}"

      - name: Upload Docker release metadata
        uses: actions/upload-artifact@v7
        with:
          name: docker-metadata
          path: release-metadata/*.txt

  release:
    name: Create GitHub release
    needs: [linux-build, macos-build, docker-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-artifacts-*
          path: releases/
          merge-multiple: true

      - name: Download Docker metadata
        uses: actions/download-artifact@v8
        with:
          name: docker-metadata
          path: releases/

      - name: Generate sha256 checksums
        run: |
          set -euo pipefail
          cd releases/
          shopt -s nullglob
          files=(*.tar.gz *.zip docker-*.txt)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > checksums.sha256
          cat checksums.sha256

      - name: List release files
        run: ls -la releases/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          files: |
            releases/*
